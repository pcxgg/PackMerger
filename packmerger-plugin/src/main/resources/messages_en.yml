# PackMerger Player-Facing Messages
# Uses MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
# Placeholders use {name} syntax and are replaced before parsing.

# Reload
reload.starting: "<yellow>Reloading PackMerger...</yellow>"

# Validate
validate.no-pack: "<red>No merged pack found. Run a merge first.</red>"
validate.starting: "<yellow>Running validation...</yellow>"
validate.complete: "<gray>Validation complete: <yellow>{warnings}</yellow> warnings, <red>{errors}</red> errors</gray>"
validate.error-line: "<red>{message}</red>"
validate.warning-line: "<yellow>{message}</yellow>"

# Status
status.header: "<gold><bold>PackMerger Status</bold></gold>"
status.server: "<gray>Server: <white>{server}</white></gray>"
status.upload-provider: "<gray>Upload Provider: <white>{provider}</white></gray>"
status.last-merge: "<gray>Last Merge: <white>{time}</white></gray>"
status.pack-url: "<gray>Pack URL: <white>{url}</white></gray>"
status.hosting-route: "<gray>Hosting route: <white>{route}</white></gray>"
status.self-host: "<gray>Self-host: <white>port {port}, {state}</white></gray>"
status.resolved-host: "<gray>Resolved host: <white>{host}</white> (from {source})</gray>"
status.host-not-routable: "<red>Not reachable from the internet: {advice}</red>"
status.verification-passed: "<gray>Verification: <green>passed</green> at {time} <white>({detail})</white></gray>"
status.verification-failed: "<gray>Verification: <red>FAILED</red> at {time} <white>({detail})</white></gray>"
status.verification-skipped: "<gray>Verification: <white>skipped ({detail})</white></gray>"
status.verification-pending: "<gray>Verification: <white>pending ({detail})</white></gray>"
status.sha1: "<gray>SHA1: <white>{hash}</white></gray>"
status.pack-size: "<gray>Pack Size: <white>{size}</white></gray>"
status.merging: "<gray>Merging: <white>{status}</white></gray>"
status.packs-in-folder: "<gray>Packs in folder: <white>{count}</white></gray>"
status.plugin-packs: "<gray>Plugin packs: <white>{packs}</white></gray>"
status.plugin-packs-off: "<gray>Plugin packs: <white>discovery off (plugin-packs.enabled: false)</white></gray>"
status.integration: "<gray>  - <white>{state}</white></gray>"
status.api-packs: "<gray>API packs: <white>{packs}</white></gray>"
status.last-upload-none: "<gray>Last upload: <white>none yet</white></gray>"
status.last-upload-ok: "<gray>Last upload: <green>ok</green> at {time} <white>({detail})</white></gray>"
status.last-upload-failed: "<gray>Last upload: <red>FAILED</red> at {time} <white>({detail})</white></gray>"
status.hosts-clean: "<gray>Other pack hosts: <green>none</green> <white>(checked: {checked})</white></gray>"
status.host-conflict: "<red>Other pack host: {plugin} {key}: {value}</red> <gray>(set {fix}; /pm fixup {id})</gray>"
status.host-conflict-dismissed: "<gray>Other pack host: {plugin} {key}: {value} (dismissed; /pm fixup {id})</gray>"
status.bedrock-off: "<gray>Bedrock: <white>conversion off; Floodgate {floodgate}; Java pack {java}</white></gray>"
status.bedrock-on: "<gray>Bedrock: <white>last conversion {last}; Geyser folder: {geyser}; Floodgate {floodgate}; Java pack {java}</white></gray>"
status.logging: "<gray>Logging: <white>{level}</white> (verbose {verbose}; /pm verbose on|off)</gray>"

# Verbose
verbose.state: "<gray>Verbose logging is <white>{state}</white> (log-level: {level}).</gray>"
verbose.enabled: "<green>Verbose logging enabled</green> <gray>(log-level: debug, saved to config.yml)</gray>"
verbose.disabled: "<green>Verbose logging disabled</green> <gray>(log-level: info, saved to config.yml)</gray>"

# Fixup (other plugins hosting their own pack)
fixup.finding: "<yellow>{line}</yellow> <gray>→ /pm fixup {id}</gray>"
fixup.none: "<green>No other plugin is set up to host, send or protect its own pack.</green>"
fixup.not-installed: "<red>{plugin} is not installed.</red>"
fixup.nothing: "<gray>{plugin}: nothing to change ({detail}).</gray>"
fixup.done: "<green>Updated {file}:</green>"
fixup.change: "<gray>  {key}: <white>{value}</white></gray>"
fixup.backup: "<gray>Backup of the previous file: <white>{file}</white></gray>"
fixup.next: "<yellow>Now run {reload} so it takes effect; PackMerger re-merges its pack when it changes.</yellow>"
fixup.failed: "<red>Could not update {plugin}: {error}</red>"
fixup.dismissed: "<green>Dismissed {count} warning(s).</green> <gray>They stay hidden until the setting changes; /pm fixup lists them.</gray>"

# Apply
apply.no-pack: "<red>No merged pack available. Run a merge first.</red>"
apply.sent-all: "<green>Force-sent resource pack to {count} player(s)</green>"
apply.sent-player: "<green>Force-sent resource pack to {player}</green>"
apply.no-match: "<red>No matching player found.</red>"
apply.player-error: "<red>Player not found: {error}</red>"

# Merge pipeline
merge.already-running: "<red>A merge is already in progress!</red>"
merge.starting: "<yellow>Starting merge process...</yellow>"
merge.failed-no-packs: "<red>Merge failed — no packs found or merge error.</red>"
merge.upload-complete: "<green>Merge and upload complete!</green> <gray>URL: {url}</gray>"
merge.upload-failed: "<red>Upload failed: {error}</red>"
merge.complete-no-upload: "<green>Merge complete!</green> <gray>Auto-upload is disabled.</gray>"
merge.failed: "<red>Merge failed: {error}</red>"
