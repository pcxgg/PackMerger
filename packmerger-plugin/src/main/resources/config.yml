# =============================================================================
# PackMerger Configuration
# =============================================================================
# This file controls all aspects of the PackMerger plugin: how packs are merged,
# where the merged result is uploaded, and how it's distributed to players.
#
# After making changes, run /packmerger reload to apply them.
# =============================================================================

# Config schema version. Do not edit by hand. PackMerger logs a notice on
# startup if this is older than the plugin expects, so you know to review the
# latest config.yml for newly added options. Missing keys always fall back to
# safe defaults, so upgrades never break — this is purely informational.
config-version: 5

# =============================================================================
# Server Identity
# =============================================================================

# The name of this server, used to look up per-server pack configurations below.
# If left empty (default), the plugin reads the "server-name" property from
# server.properties automatically. This is useful for multi-server networks
# where each backend server needs a slightly different merged pack.
#
# Valid values: any string, or "" for auto-detection
# Default: "" (auto-detect from server.properties)
server-name: ""

# =============================================================================
# Pack Priority
# =============================================================================

# Ordered list of resource pack filenames that determines merge precedence.
# The first entry has the HIGHEST priority — its files win when two packs contain
# the same non-mergeable file (e.g. the same texture path).
#
# Use the exact filename including the .zip extension for zip packs, or the folder
# name for unzipped packs placed directly in the packs/ directory.
#
# Packs found in the packs/ folder but not listed here will still be merged, but
# at the lowest priority with a console warning. Add them here to control ordering.
priority:
  - "main-pack.zip"
  - "ui-overhaul.zip"
  - "custom-models.zip"

# =============================================================================
# Remote Pack Sources (optional)
# =============================================================================

# Remote packs are downloaded from a URL into packs/.remote-cache/<alias>.zip
# and appear in the merge pipeline under their alias. Reference them in
# priority: by alias (without .zip) — e.g. "- quality-armory" for a remote
# pack declared as remote-packs: { quality-armory: ... }.
#
# Refresh policy controls when the plugin re-downloads a pack:
#   "on-startup" — fetch when the plugin enables
#   "on-reload"  — fetch on startup AND on /pm reload
#   "manual"     — only fetch on /pm fetch <alias>
#
# HTTP caching (ETag / Last-Modified) is honored automatically; unchanged
# origins return 304 and the cached copy is reused.
#
# If a fetch fails but a cached copy exists, the cached copy is used and a
# warning is logged. If both fail, the pack is skipped with an error.
#
# Removing an alias from this list deletes its cached copy from
# packs/.remote-cache/ on the next merge, so it stops being merged.
#
# SECURITY: PackMerger does not validate the pack's contents beyond normal
# merge validation. You're trusting whatever is at the URL. Pin to a
# specific release tag or checksum in the URL when possible.
#
# Environment-variable substitution is supported in url / auth fields —
# write "${VAR_NAME}" to pull from the server process's environment rather
# than committing secrets to config.yml.
#
# Default: remote-packs: {} (feature not in use)
remote-packs:
#  quality-armory:
#    url: "https://github.com/user/repo/releases/latest/download/pack.zip"
#    refresh: "on-startup"
#    # auth block is optional
#    auth:
#      type: "bearer"                 # "none", "bearer", or "basic"
#      token: "${GITHUB_TOKEN}"       # env-var substitution
#  internal-ui:
#    url: "https://artifacts.internal.example.com/packs/ui-latest.zip"
#    refresh: "on-reload"
#    allow-http: false                # set true only for internal stores
#    auth:
#      type: "basic"
#      username: "${ARTIFACT_USER}"
#      password: "${ARTIFACT_PW}"

# =============================================================================
# Plugin Packs (auto-discovery)
# =============================================================================

# PackMerger can automatically pull in the resource packs generated by OTHER
# installed plugins and merge them, with no manual file copying. Each detected
# plugin's current pack is staged into packs/.plugin-packs/<alias>.zip before every
# merge, then merged like any other pack. Reference an alias in 'priority:' above
# to control its precedence.
#
# Built-in aliases (plugin -> where its pack is read from, relative to plugins/):
#   oraxen              Oraxen              Oraxen/pack/pack.zip
#   nexo                Nexo                Nexo/pack/pack.zip
#   itemsadder          ItemsAdder          ItemsAdder/output/generated.zip
#   modelengine         ModelEngine         ModelEngine/resource pack.zip (or the folder)
#   elitemobs           EliteMobs           EliteMobs/resource_pack [cluster]
#   freeminecraftmodels FreeMinecraftModels FreeMinecraftModels/output/FreeMinecraftModels.zip
#                                           + FreeMinecraftModels/resource_pack [cluster]
#   nova                Nova                Nova/resource_pack/ResourcePack.zip
#   betterhud           BetterHUD           BetterHUD/build.zip
#   valhallammo         ValhallaMMO         ValhallaMMO/resourcepack (folder)
#   vane                vane-core           vane-resource-pack.zip (in plugins/ or the server root)
#   backpackplus        BackpackPlus        BackpackPlus/pack/resourcepack.zip
#   betterstructures    BetterStructures    BetterStructures/resource_pack [cluster]
#   cannonrtp           CannonRTP           CannonRTP/resource_pack [cluster]
#   eternaltd           EternalTD           EternalTD/resource_pack [cluster]
#   infinitevehicles    InfiniteVehicles    InfiniteVehicles/InfiniteModelPack.zip
#   megablocksurvivors  MegaBlockSurvivors  MegaBlockSurvivors/resourcepack or /resource_pack
#   resurrectionchest   ResurrectionChest   ResurrectionChest/resource_pack [cluster]
#   mmoinventory        MMOInventory        downloaded from the author's published URL (*)
#   realisticsurvival   RealisticSurvival   downloaded from the author's published URL (*)
#
# A [cluster] is a folder that holds several packs (folders or zips); they are
# unioned into one staged pack (alphabetically first pack wins plain-file clashes,
# lang/atlas/sounds/model JSON is merged). A folder that is not a pack itself but
# contains packs is treated as a cluster automatically.
#
# (*) NETWORK: MMOInventory and RealisticSurvival only publish their pack as a
# download, so when (and only when) one of those plugins is installed, PackMerger
# downloads its pack from the author's Dropbox link on startup and on /pm reload
# (cached in packs/.plugin-packs/). Set sources.<alias>.enabled: false to opt out,
# or sources.<alias>.path to use a local copy instead.
#
# Every staged source must have pack.mcmeta or assets/ at its root (a zip wrapped
# in a single folder is unwrapped). Anything else is skipped with a console line
# and listed in the advisory admins see on join. When a plugin is removed, its
# adapter is disabled, or its source disappears, the staged copy is deleted so it
# stops merging.
#
# Because other plugins generate their packs after they enable, the first merge on
# startup is delayed by 'merge-delay-seconds'. Meanwhile the pack merged before the
# restart (if any) is served right away, so players joining early still get a pack.
# After that, the watcher below picks up rebuilt packs (e.g. /oraxen reload) on its
# own; /pm merge forces a merge.
#
# ItemsAdder, Oraxen and Nexo can also host and send their own pack, so players
# get two packs (and theirs may replace the merged one). PackMerger reads their
# config (ItemsAdder config.yml, Oraxen/Nexo settings.yml) on startup, on
# /pm reload and before every merge, and warns on the console, in /pm status and
# to admins on join with the exact setting to change. It also flags ItemsAdder's
# unzip protection and compress-json-files, which make its pack unreadable here.
# /pm fixup <itemsadder|oraxen|nexo> backs up that plugin's config and writes the
# change; /pm fixup dismiss hides the current warnings (stored in
# dismissed-warnings.yml). Nothing is changed without that command.
#
# Plugins can also add their pack through PackMerger's API
# (PackMergerApi.registerPack); those are staged into packs/.api-packs/ and are
# placed in 'priority:' by the alias the plugin chose (see /pm status).
plugin-packs:
  enabled: true
  merge-delay-seconds: 10

  # Poll the resolved plugin pack paths and re-merge when one changes. Only
  # file sizes and timestamps are read, every 'interval-seconds'; a change must
  # hold for two polls before a merge starts.
  # Default: enabled: true, interval-seconds: 5
  watch:
    enabled: true
    interval-seconds: 5

  # Before copying a changed source, its size and modification time must stay
  # the same for 'polls' readings taken 'interval-millis' apart, so a pack a
  # plugin is still writing is never staged half-done. A source that is still
  # changing is retried once it settles (the previous staged copy stays in use).
  # Default: polls: 3, interval-millis: 1000
  stability:
    polls: 3
    interval-millis: 1000

  # Per-plugin overrides and your own adapters (all optional):
  #   enabled: false   skip this plugin (its staged copy is deleted)
  #   path:            where to read the pack (relative to plugins/, or absolute);
  #                    a single path or a list of candidates, first existing wins
  #   cluster: true    the path is a folder of packs to union
  #   plugin:          plugin that must be installed for this source to be used
  #                    (custom adapters without 'plugin' are always used)
  #   url:             replace the download URL of mmoinventory/realisticsurvival
  # Any alias that is not built in becomes a new adapter, so a plugin PackMerger
  # does not know yet needs no update.
  sources: {}
#  sources:
#    oraxen:
#      path: "Oraxen/pack/pack.zip"
#    itemsadder:
#      enabled: false
#    my-plugin:
#      plugin: "MyPlugin"
#      path: "MyPlugin/generated/resource_pack"
#      cluster: true

# =============================================================================
# Profiles (optional)
# =============================================================================

# Profiles let you switch entire pack compositions atomically via
# /pm profile switch <name> — useful for seasonal events (halloween, anniversary)
# or A/B testing different pack loadouts.
#
# When active-profile names a defined profile, its priority + server-packs
# shadow the root-level keys above. When active-profile is empty or the
# profiles section is absent, PackMerger uses the root-level keys as before.
# This is fully backwards-compatible with 1.0.x configs.
#
# Default: profiles: {} (not in use; root-level priority/server-packs apply)
active-profile: ""
profiles:
#  default:
#    priority:
#      - "main-pack.zip"
#      - "ui-overhaul.zip"
#    server-packs: {}
#  halloween:
#    priority:
#      - "halloween-overlay.zip"
#      - "main-pack.zip"
#      - "ui-overhaul.zip"
#    server-packs:
#      survival:
#        additional:
#          - "halloween-survival.zip"
#        exclude: []

# =============================================================================
# Per-Server Pack Configuration
# =============================================================================

# Allows each server in a network to include additional packs or exclude certain
# packs from the global priority list. The server is matched by the "server-name"
# value above (case-insensitive).
#
# "additional" packs are merged at LOWER priority than the global priority list.
# "exclude" packs are skipped entirely for that server.
#
# Only useful for multi-server setups. Leave commented out for single servers.
server-packs:
#  blazebornsmp:
#    # Extra packs to include for this server only (merged at lowest priority)
#    additional:
#      - "blazeborn-textures.zip"
#    # Packs from the global priority list to skip on this server
#    exclude: []
#  cobaltsmp:
#    additional:
#      - "cobalt-textures.zip"
#    exclude:
#      - "ui-pack.zip"

# =============================================================================
# Merge Settings
# =============================================================================

merge:
  # Whether to automatically run the merge pipeline on server startup.
  # If false, you must manually run /packmerger reload to trigger the first merge.
  #
  # Valid values: true, false
  # Default: true
  auto-merge-on-startup: true

  # How a model (assets/<ns>/models/**) or blockstate (assets/<ns>/blockstates/**)
  # is combined when two packs ship the same file. Applies inside overlay
  # directories too.
  #
  #   whole-file  The higher-priority pack's file wins whole. Only the list-shaped
  #               parts are combined: a model's "overrides" (CustomModelData
  #               entries, deduped by predicate and sorted by custom_model_data)
  #               and a blockstate's "multipart" when both files use multipart.
  #               This never builds a hybrid, e.g. an item/generated model that
  #               inherits another pack's 3D "elements".
  #   deep        The behaviour before config-version 4: a key-by-key deep merge
  #               (higher priority wins per key), plus the same overrides/multipart
  #               concatenation. Use it only if you relied on two packs filling in
  #               different keys of the same model.
  #
  # CHANGED in config-version 4: the default was "deep" before. Configs without
  # this key now get whole-file; add "model-policy: deep" to keep the old result.
  #
  # Item definitions (assets/<ns>/items/*.json, 1.21.4+) are not affected by this
  # setting: they are combined only when both files dispatch on the same property
  # (range_dispatch entries by threshold, select cases by "when"); otherwise the
  # higher-priority file wins whole and a collision warning names both packs.
  #
  # Valid values: whole-file, deep
  # Default: whole-file
  model-policy: whole-file

  # ---- Optimization ----
  optimization:
    # Remove junk and OS metadata files from the merged pack output.
    # Strips files like .DS_Store, Thumbs.db, desktop.ini, .gitignore, and
    # anything inside __MACOSX or .git directories.
    #
    # Valid values: true, false
    # Default: true (recommended — these files waste space and serve no purpose)
    strip-junk-files: true

    # ZIP compression level for the merged output file.
    #   0 = no compression (fastest build, largest file)
    #   1-3 = light compression (fast)
    #   4-6 = balanced (recommended)
    #   7-9 = maximum compression (slowest build, smallest file)
    #
    # Higher compression reduces download size for players but increases merge time.
    #
    # Valid values: 0-9
    # Default: 6 (good balance of size and speed)
    compression-level: 6

    # Log a console warning if the merged pack exceeds this size in megabytes.
    # Large packs (100+ MB) may cause download timeouts for players on slow connections.
    # Set to 0 to disable the warning.
    #
    # Valid values: 0 (disabled) or any positive integer
    # Default: 100
    size-warning-mb: 100

  # ---- Hot Reload ----
  hot-reload:
    # Watch the packs/ folder for file changes and automatically re-merge.
    # When enabled, adding, modifying, or removing a pack file triggers a new merge
    # after the debounce period. Folders below packs/ are watched too, so editing a
    # file inside an unzipped pack folder also triggers a merge. Dot-folders
    # (.remote-cache, .plugin-packs) are ignored; the plugin-packs watcher above
    # covers plugin packs. Useful during development when iterating on packs.
    #
    # Valid values: true, false
    # Default: true
    enabled: true

    # How many seconds to wait after the LAST file change before triggering a merge.
    # This debounce prevents excessive re-merges when copying multiple files at once
    # (e.g. extracting a new pack zip). The timer resets with each new file event.
    #
    # Valid values: any positive integer (recommended: 3-10)
    # Default: 5
    debounce-seconds: 5

  # ---- Copy the merged pack elsewhere ----
  # After every merge, copy the merged zip (merged-pack.zip, or
  # <server-name>-merged-pack.zip with per-server packs) into these folders, for
  # example a web server's document root or another plugin that serves it.
  # Folders are relative to plugins/ unless absolute, and are created if missing.
  # A folder inside PackMerger's packs/ is refused (it would be merged again).
  # The copy is written to a temp file and moved into place, so a reader never
  # sees a half-written zip. Hosting and sending are unchanged.
  #
  # Valid values: a folder, or a list of folders
  # Default: [] (no copies)
  output-copy-to: []

# =============================================================================
# Upload Settings
# =============================================================================

upload:
  # Whether to automatically upload the merged pack after every merge.
  # If false, the merged pack is written to disk but not uploaded or served.
  # You would need to manually distribute the file from the output/ folder.
  #
  # Valid values: true, false
  # Default: true
  auto-upload: true

  # Which upload provider to use for serving the merged pack to players.
  #
  # Valid values:
  #   "polymath"  — self-hosted Polymath server instance
  #   "self-host" — built-in HTTP server (simplest, no external service needed)
  #   "s3"        — any S3-compatible object store: AWS S3, Cloudflare R2, Backblaze B2
  #
  # Default: "self-host"
  provider: "self-host"

  # Providers to publish through, in order, when the provider above can't be
  # used: its upload failed, or (self-host) the reachability check failed or
  # the auto-detected host is not routable. Only providers that are configured
  # below are tried. If none works, a self-host URL that failed its check is
  # still used rather than sending no pack.
  # Example: ["s3"] - self-host first, Cloudflare R2/S3 when self-host is not
  # reachable from the internet.
  #
  # Valid entries: "self-host", "s3", "polymath"
  # Default: [] (no fallback)
  fallback: []

  # ---- Polymath Configuration ----
  # Only used when provider is "polymath". Uploads to a Polymath server.
  # Polymath is a lightweight Python web server for hosting resource packs.
  # GitHub: https://github.com/oraxen/polymath
  #
  # NOTE: The public Oraxen instance (atlas.oraxen.com) has been shut down.
  # You must self-host your own Polymath instance to use this provider.
  polymath:
    # Polymath server URL (no trailing slash).
    # Example: http://localhost:5000
    #
    # Default: ""
    server: ""

    # Shared secret for upload authentication.
    # Must match the secret configured on the Polymath server.
    #
    # Default: ""
    secret: ""

    # Unique ID for this server's pack (used to overwrite previous uploads).
    # Each upload with the same ID replaces the previous pack for that ID.
    # If left empty, uses the server name from config or server.properties.
    #
    # Default: "" (use server name)
    id: ""

  # ---- Self-Host Configuration ----
  # Only used when provider is "self-host" (or "self-host" is listed in fallback).
  # Runs a built-in HTTP server that serves the pack at /pack. It answers GET and
  # HEAD, sends a strong ETag (the pack's SHA-1) and honours If-None-Match (304)
  # and Range (206), so CDNs, reverse proxies and health checks work with it.
  self-host:
    # The port for the built-in HTTP server to listen on (TCP, all interfaces).
    # The port must be open in your firewall / forwarded by your router.
    #
    # -1 = the Minecraft server port + 1 (e.g. 25565 -> 25566). On hosting panels
    # (Pterodactyl, Pelican, ...) add a second port allocation to the server and
    # set this to that port (or make it the Minecraft port + 1 and keep -1).
    # PackMerger warns if the port equals the Minecraft port, rcon.port (when
    # RCON is enabled) or query.port (when query is enabled).
    #
    # Valid values: -1, or 1-65535
    # Default: -1 (was 8080 before config-version 4; an explicit port is kept)
    port: -1

    # The complete public URL players download the pack from. Used as-is:
    #   "https://cdn.example.com/rp.zip"    -> exactly that URL
    #   "https://example.com/packs/pack"    -> exactly that URL
    #   "http://play.example.com:25566"     -> "/pack" is appended (no path given)
    # Set this when the server is behind a reverse proxy, a CDN or NAT. The proxy
    # must forward to http://<this machine>:<port>/pack; requests that arrive with
    # this URL's own path are served too.
    #
    # Default: "" (auto: see public-host below)
    public-url: ""

    # When public-url is empty, the URL is built as http://<host>:<port>/pack and
    # the host is the first publicly routable one of:
    #   1. public-host (below)
    #   2. this server's public IP, if detect-public-ip is true
    #   3. server-ip from server.properties
    #   4. the bind address (advertised as "localhost")
    # Loopback, private (10.x, 172.16-31.x, 192.168.x), link-local, CGNAT
    # (100.64-127.x), 0.0.0.0 and IPv6 unique-local addresses are NOT routable:
    # if nothing better is found PackMerger still uses one of them (LAN players
    # can download) but warns on every merge, tells admins on join and shows
    # the fix in /pm status.
    #
    # Host name or IP only, no scheme or port. Example: "play.example.com"
    # Default: "" (not set)
    public-host: ""

    # Look up this server's public IP address through a third-party service.
    # PRIVACY: when true, PackMerger makes an outbound HTTPS request to the
    # services below (by default Amazon checkip and ipify), which learn this
    # server's IP address. Off by default; done once per start / reload, only
    # when public-url and public-host are both empty.
    #
    # Default: false
    detect-public-ip: false

    # Services asked for the public IP, in order. Each must answer with the IP
    # as plain text.
    public-ip-services:
      - "https://checkip.amazonaws.com"
      - "https://api.ipify.org"

    # After every upload, check that the pack can really be downloaded: the
    # first KiB is fetched from 127.0.0.1:<port> and from the advertised URL
    # (this machine connecting to its own public address, which also catches
    # routers without NAT hairpinning) and compared byte for byte. Runs off the
    # main thread. A failure is logged, shown to admins and in /pm status, and
    # switches to the next provider in upload.fallback when one is configured.
    # If you set public-url yourself, a failing advertised-URL check only warns
    # (some NATs/CDNs can't be reached from inside), it never switches.
    #
    # Default: true
    verify: true

    # Maximum number of concurrent pack downloads allowed at the same time.
    # When the limit is reached, additional download requests get a 429 (Too Many
    # Requests) response until a slot opens up. This prevents the server from being
    # overwhelmed during mass player joins.
    #
    # Set to 0 for unlimited concurrent downloads (not recommended for large servers).
    #
    # Valid values: 0 (unlimited) or any positive integer
    # Default: 50
    rate-limit: 50

  # ---- S3 / R2 / Backblaze B2 Configuration ----
  # Only used when provider is "s3". Uploads the merged pack to any S3-compatible
  # object store. One config works for AWS S3, Cloudflare R2, and Backblaze B2 —
  # only the endpoint URL differs.
  #
  # Credentials support ${VAR_NAME} env substitution so secrets don't live in
  # config.yml. Commit env vars via your process manager / systemd unit.
  s3:
    # S3 API endpoint. Examples:
    #   AWS:       "https://s3.us-east-1.amazonaws.com"
    #   R2:        "https://<account-id>.r2.cloudflarestorage.com"
    #   Backblaze: "https://s3.us-west-004.backblazeb2.com"
    endpoint: ""

    # SigV4 region. R2 accepts "auto". AWS uses the canonical region name.
    # Backblaze uses the region shown in your bucket's endpoint URL.
    region: "us-east-1"

    # Target bucket. Must already exist and be writable by the access key below.
    bucket: ""

    # Credentials. Prefer env-var substitution:
    access-key: "${S3_ACCESS_KEY}"
    secret-key: "${S3_SECRET_KEY}"

    # Optional: prefix every object key with this (no leading slash).
    # Example: "packs/" produces objects like "packs/<sha1>.zip".
    path-prefix: ""

    # CDN base URL served in front of the bucket. If set, the returned pack URL
    # is "<public-url-base>/<key>" — so you'd set this to your CDN/Worker host.
    # Leave empty to fall back to "<endpoint>/<bucket>/<key>" which works for
    # public buckets on R2 and Backblaze out of the box.
    public-url-base: ""

    # ACL applied to uploaded objects.
    #   "public-read" — anyone with the URL can download (default)
    #   "private"     — returns a short-lived presigned URL instead
    acl: "public-read"

    # Cache-Control header attached to uploads. Long TTL is fine when
    # key-strategy is content-addressed (each merge gets a new URL).
    cache-control: "public, max-age=3600"

    # How object keys are chosen:
    #   "content-addressed" — "<prefix><sha1>.zip". Each merge writes a new key,
    #                         so clients that have cached the previous URL keep
    #                         their copy until a hash change forces a re-download.
    #                         Recommended for correctness. Use retention to bound
    #                         storage.
    #   "stable"            — "<prefix><server-name>.zip". Every merge overwrites
    #                         the same object. Simpler, but breaks client HTTP
    #                         caching since the URL never changes.
    #
    # Default: "content-addressed"
    key-strategy: "content-addressed"

    # When acl is "private", URLs are presigned with this lifetime.
    # Ignored when acl is "public-read".
    presign-duration-hours: 24

    # Retention policy for content-addressed keys. After each successful upload,
    # list objects under <path-prefix> and delete anything beyond the latest N.
    # Set to 0 to disable (unbounded growth).
    retention:
      keep-latest: 5

# =============================================================================
# Distribution Settings
# =============================================================================

distribution:
  # Whether to automatically send the resource pack to players when they join.
  # If false, the pack is merged and uploaded but never sent to players automatically.
  # You can still use /packmerger apply to send it manually.
  #
  # Valid values: true, false
  # Default: true
  enabled: true

  # Marks the pack as required in the request the client receives. The client then
  # shows a "required" prompt with no "proceed without" button. On its own this flag
  # does NOT kick anyone: PackMerger only kicks when enforce-required (below) is on.
  #
  # Valid values: true, false
  # Default: false
  required: false

  # Server-side enforcement for a required pack (only used when required: true).
  # When enabled, PackMerger kicks a player who declines the pack, or whose download
  # still fails after the retries below are used up. INVALID_URL and FAILED_RELOAD
  # never kick: those point at a hosting or pack problem that would lock everyone out.
  enforce-required:
    # Valid values: true, false
    # Default: false (the required flag is sent, nobody is kicked)
    enabled: false
    # Kick message (MiniMessage).
    kick-message: "<red>This server requires its resource pack.</red> <gray>Rejoin and accept it to play.</gray>"

  # Custom prompt message shown to players when they receive the resource pack request.
  # Uses MiniMessage formatting (https://docs.advntr.dev/minimessage/format.html).
  # Leave empty to use Minecraft's default prompt.
  #
  # Example: "<yellow>Please accept our resource pack for the best experience!</yellow>"
  #
  # Default: "" (Minecraft default)
  prompt-message: ""

  # PackMerger sends its pack under one stable UUID per server (derived from
  # server-name), so sending it again always replaces PackMerger's own pack and never
  # stacks a second copy. Packs from a proxy or other plugins are never removed
  # (before 1.3.0, false cleared ALL of the player's server packs).
  #   false — PackMerger first removes its own previous pack, then sends the new one
  #   true  — PackMerger only sends; the client swaps its pack in place (same UUID)
  #
  # Valid values: true, false
  # Default: false
  use-add-resource-pack: false

  # Delay in server ticks (1 tick = 50ms) before sending the pack after a player joins.
  # A short delay gives the client time to finish loading the world before receiving
  # the pack prompt. Too short may cause the prompt to appear before the player can
  # interact; too long feels sluggish.
  #
  # Valid values: any non-negative integer (recommended: 10-40)
  # Default: 20 (1 second)
  join-delay-ticks: 20

  # The pack is sent on every join. The client drops server packs when it
  # disconnects, and it caches downloads by SHA-1, so an unchanged pack is applied
  # from the client's cache without downloading again. (The old "cache" section,
  # which skipped the send on rejoin and left players without the pack, was removed
  # in 1.3.0; delete it from older configs.)
  #
  # Players who join before the first pack is ready are sent it automatically as
  # soon as it is published, whatever on-new-pack.action says.

  # ---- Self-heal ----
  retry:
    # When a client reports FAILED_DOWNLOAD or DISCARDED for PackMerger's pack, send it
    # again after delay-ticks, at most max-attempts times per session. INVALID_URL and
    # FAILED_RELOAD are not retried (a resend can't fix them); a diagnosis is logged.
    #
    # Valid values: 0 (off) or more
    # Default: 3
    max-attempts: 3
    # Valid values: 1 or more (1 tick = 50ms)
    # Default: 40 (2 seconds)
    delay-ticks: 40

  # Don't send the Java pack to Bedrock players who connect through Geyser + Floodgate
  # (detected through the Floodgate API when Floodgate is installed; no effect otherwise).
  #
  # Valid values: true, false
  # Default: true
  skip-bedrock-players: true

  # ---- New Pack Behavior ----
  on-new-pack:
    # What to do when a new merged pack is produced while players are already online
    # (e.g. after a hot-reload or manual /packmerger reload). A re-merge with identical
    # content produces the same SHA-1 and is not a new pack, so nothing happens.
    # Players who joined before the first pack existed always get it, whatever this says.
    #
    # Valid values:
    #   "none"   — do nothing; players get the new pack on next join
    #   "notify" — send a chat message to players with the packmerger.notify permission
    #   "resend" — immediately send the new pack to all online players (may interrupt gameplay)
    #
    # Default: "notify"
    action: "notify"

    # The chat message sent to online players when action is "notify".
    # Uses MiniMessage formatting. Only sent to players with the packmerger.notify
    # permission (default: all players).
    #
    # Default: (see below)
    notify-message: "<yellow>[PackMerger]</yellow> <gray>A new resource pack is available. Rejoin or use F3+T to reload.</gray>"

  # Push the merged pack's URL + SHA-1 to a Velocity/Bungee proxy so the pack is
  # offered network-wide from the proxy (instead of each backend sending its own).
  # Requires the PackMerger proxy plugin (packmerger-velocity) installed on the
  # proxy. The proxy can also be given the URL directly in its own config.
  # Off by default.
  proxy-notify: false

# =============================================================================
# Bedrock / Geyser (optional)
# =============================================================================

# Convert the merged Java pack into a Bedrock resource pack (+ Geyser custom-item
# mappings) so Bedrock/Floodgate players see the same custom items as Java players.
#
# SCOPE: this converts 2D custom item icons declared via the 1.21.4+ item-definition
# format (custom_model_data → model → layer0 texture). 3D block/geometry models are
# not yet converted. The generated .mcpack + <name>.geyser.json are written to
# output/bedrock/ and, when auto-deploy is on, copied into Geyser's packs/ and
# custom_mappings/ folders (restart Geyser or reload it to apply).
#
# Disabled by default — enable it only if you run Geyser, and verify the result with
# a Bedrock client.
bedrock:
  enabled: false
  auto-deploy-to-geyser: true
  # Geyser data folder (absolute, or relative to the server folder).
  # Empty = auto-detect: the data folder of an installed Geyser-* plugin, else
  # plugins/Geyser-Spigot, else plugins/Geyser-Paper.
  # The .mcpack's manifest version is derived from its content, so Bedrock clients
  # download it again whenever the converted items change.
  geyser-folder: ""
  # Verbose per-item conversion logging (lists every item/model that was skipped).
  debug: false

# =============================================================================
# Validation
# =============================================================================

validation:
  # How to treat pack_format mismatches between the merged pack's pack.mcmeta
  # and the running server's Minecraft version. Mismatches silently break
  # rendering in-game (missing models, missing textures), so surfacing them at
  # merge time is usually what you want.
  #
  # Valid values:
  #   "warn"  — log a WARNING but allow the merge (default)
  #   "error" — log an ERROR (counts toward validation errors, so with
  #             rollback-on-errors the broken pack is not shipped)
  #   "off"   — skip the check entirely
  #
  # The registry of MC version → expected pack_format is maintained inside the
  # plugin (PackFormatRegistry). If you're on a brand-new MC release that hasn't
  # been added yet, the check silently skips so you don't get noise.
  #
  # Default: "warn"
  pack-format-check: "warn"

  # When a merge produces a pack that fails validation (errors, not warnings),
  # rollback keeps the previous merged pack live so players continue seeing a
  # working version instead of a broken one. The failed attempt is discarded
  # and a PackValidationFailedEvent fires so other plugins can page someone.
  # The previous pack stays live across restarts and /pm reload too: on startup
  # and after a reload the existing output is served again before the next merge.
  #
  # Only kicks in when a previous output actually exists — on the very first
  # merge with a broken pack, there is nothing to roll back to and we ship
  # the broken pack anyway (with a loud error log).
  #
  # Valid values: true, false
  # Default: true
  rollback-on-errors: true

  # Whether non-critical warnings (missing textures, invalid JSON in non-
  # critical files) should also trigger rollback. Most operators want only
  # hard errors to block a ship, so warnings-only packs still go out.
  #
  # Valid values: true, false
  # Default: false
  fail-on-warnings: false

  # Scan the merged pack for textures and sounds that no JSON file references.
  # Unreferenced assets ship to every player download for nothing, so surfacing
  # them lets you trim bloated packs. Reported as warnings — never errors —
  # and the scan runs after every merge.
  #
  # Note: atlas sources of type "filter" (regex-based) aren't expanded, so
  # packs that rely on them may see false-positive orphan warnings for matched
  # textures. Disable this check if that's noisy for your pack set.
  #
  # Valid values: true, false
  # Default: true
  detect-orphans: true

  # How many of the largest orphan assets to list in the validation summary.
  # The full list is written to output/last-merge-report.txt via /pm inspect
  # export if you need the complete picture.
  #
  # Valid values: any positive integer
  # Default: 20
  orphan-report-limit: 20

# =============================================================================
# Logging
# =============================================================================

# Minimum log level. Controls how verbose console output is.
# Messages at this level and above are shown; messages below are hidden.
#
# Valid values:
#   "debug"   — show everything (verbose, useful for troubleshooting)
#   "info"    — normal operation (default)
#   "warning" — only warnings and errors
#   "error"   — only errors
#
# /pm verbose on|off switches between "debug" and "info" at runtime and saves
# the choice here.
#
# Default: "info"
log-level: "info"

# =============================================================================
# Update Check
# =============================================================================

# PackMerger polls a small versions.json file in the GitHub repo on enable to
# see if a newer release is available. Results are logged to the console and
# admins see a one-line chat notice on join. No auto-download; everything is
# advisory.
#
# This is an outbound request to raw.githubusercontent.com (GitHub), which sees
# your server's IP address; nothing else is sent. Disable this if your server
# doesn't have outbound internet or you don't want the startup HTTP call.
update-check:
  enabled: true
  url: "https://raw.githubusercontent.com/PCX-Network/PackMerger/master/versions.json"
