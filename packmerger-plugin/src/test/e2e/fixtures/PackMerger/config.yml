# PackMerger config for the plugwright E2E server. Staged into
# plugins/PackMerger/config.yml before every run. Everything that would reach
# the internet (update check, remote packs, plugin-pack discovery) is off.
# plugin-packs.spec.ts flips the "# e2e:" marked lines to exercise discovery
# against the fake plugin output in plugins/PmE2EFake/.
config-version: 3
server-name: "e2e"
priority:
  - "overlay-pack"
  - "base-pack"
remote-packs: {}
plugin-packs:
  enabled: false # e2e:plugin-packs
  merge-delay-seconds: 0
  watch:
    enabled: true
    interval-seconds: 1
  stability:
    polls: 2
    interval-millis: 300
  sources:
    # Operator-defined adapters: a cluster of two packs gated on PackMerger
    # itself (always installed) and a folder that is not a pack.
    e2e-fake:
      enabled: true # e2e:fake-source
      plugin: "PackMerger"
      path: "PmE2EFake/resource_pack"
      cluster: true
    e2e-broken:
      path: "PmE2EFake/not_a_pack"
# Profiles are defined but none is active, so the root-level priority applies.
active-profile: ""
profiles:
  standard:
    priority:
      - "overlay-pack"
      - "base-pack"
  inverted:
    priority:
      - "base-pack"
      - "overlay-pack"
server-packs: {}
merge:
  auto-merge-on-startup: true
  optimization:
    strip-junk-files: true
    compression-level: 6
    size-warning-mb: 100
  hot-reload:
    enabled: true
    debounce-seconds: 1
upload:
  auto-upload: true
  provider: "self-host"
  self-host:
    # Fixed port well away from the Minecraft/RCON ports of the concurrent E2E servers.
    port: 28567
    public-url: ""
    rate-limit: 50
distribution:
  enabled: true
  required: false
  prompt-message: ""
  use-add-resource-pack: false
  # 3 s, so a freshly connected bot has its resourcePack listener attached first.
  join-delay-ticks: 60
  cache:
    enabled: true
  on-new-pack:
    action: "notify"
    notify-message: "<yellow>[PackMerger]</yellow> <gray>A new resource pack is available. Rejoin or use F3+T to reload.</gray>"
  proxy-notify: false
bedrock:
  enabled: false
validation:
  pack-format-check: "warn"
  rollback-on-errors: true
  fail-on-warnings: false
  detect-orphans: true
  orphan-report-limit: 20
# debug so per-player resource-pack status lines reach the server log.
log-level: "debug"
update-check:
  enabled: false
