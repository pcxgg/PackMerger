plugins {
    id 'java'
    alias(libs.plugins.shadow)
    alias(libs.plugins.plugwright)
}

// group + version are set for all modules in the root build.gradle.
// The shipped jar takes the module name: packmerger-plugin-<version>.jar.

java {
    // Minecraft / Paper 26.1.2 requires Java 25.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

// Declarative list of dependencies the PackMergerLoader downloads at runtime
// from Maven Central instead of bundling into the shaded jar. Kept in a
// dedicated configuration so the generator task below resolves exactly the
// transitive closure and nothing else.
configurations {
    runtimeDownload
}

dependencies {
    compileOnly libs.paper.api

    // Bedrock converter module — shaded into the plugin jar (pure Java + Gson,
    // which Paper provides at runtime).
    implementation project(':packmerger-bedrock')

    // Shared backend<->proxy contract (PackInfo + plugin-message codec).
    implementation project(':packmerger-common')

    // Commons-compress stays shaded — small, zip-adjacent, loaded on the
    // critical path. Not worth the runtime-download indirection.
    implementation libs.commons.compress

    // bStats metrics — shaded + relocated (required by bStats).
    implementation libs.bstats

    // MinIO (S3 upload provider). compileOnly for compilation; runtimeDownload
    // for the loader to pull at startup. Transitive closure is resolved from
    // the runtimeDownload configuration and shipped in RuntimeDependencies.java.
    // Single catalog coordinate keeps the two declarations in lockstep.
    compileOnly libs.minio
    runtimeDownload libs.minio

    // Gson ships with paper-api at runtime; the test classpath needs it explicitly.
    testImplementation libs.gson
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

// Generates RuntimeDependencies.java into build/generated/ from the
// runtimeDownload configuration's resolved artifacts. Each entry is
// { groupId, artifactId, version, base64(sha256(jarBytes)) } — the loader
// uses this to download + verify on first start.
def generatedDepsDir = layout.buildDirectory.dir('generated/sources/runtime-deps')

def generateRuntimeDependencies = tasks.register('generateRuntimeDependencies') {
    inputs.files(configurations.runtimeDownload)
    outputs.dir(generatedDepsDir)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def entries = configurations.runtimeDownload.resolvedConfiguration.resolvedArtifacts.collect { art ->
            digest.reset()
            def sha = digest.digest(art.file.bytes).encodeBase64().toString()
            [art.moduleVersion.id.group, art.name, art.moduleVersion.id.version, sha]
        }.sort { a, b -> (a[0] + ':' + a[1]) <=> (b[0] + ':' + b[1]) }

        def target = generatedDepsDir.get().file('sh/pcx/packmerger/loader/RuntimeDependencies.java').asFile
        target.parentFile.mkdirs()
        def sb = new StringBuilder()
        sb << 'package sh.pcx.packmerger.loader;\n\n'
        sb << '/**\n'
        sb << ' * Auto-generated at build time; do not edit by hand.\n'
        sb << ' * Runtime dependency manifest + SHA-256 (base64) digests for the\n'
        sb << ' * PackMergerLoader. Regenerated on every build from the "runtimeDownload"\n'
        sb << ' * Gradle configuration so it always reflects the actual resolved closure.\n'
        sb << ' */\n'
        sb << 'final class RuntimeDependencies {\n\n'
        sb << '    private RuntimeDependencies() {}\n\n'
        sb << '    /** {groupId, artifactId, version, base64(sha256(jarBytes))} tuples. */\n'
        sb << '    static final String[][] DEPENDENCIES = {\n'
        entries.each { e ->
            sb << "            { \"${e[0]}\", \"${e[1]}\", \"${e[2]}\", \"${e[3]}\" },\n"
        }
        sb << '    };\n'
        sb << '}\n'
        target.text = sb.toString()
    }
}

sourceSets.main.java.srcDir(generateRuntimeDependencies.map { generatedDepsDir })

tasks.named('compileJava') {
    dependsOn generateRuntimeDependencies
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    relocate 'org.apache.commons.compress', 'sh.pcx.packmerger.libs.commons.compress'
    relocate 'org.bstats', 'sh.pcx.packmerger.libs.bstats'

    mergeServiceFiles()
    minimize {
        // bStats wires charts reflectively; keep all its classes.
        exclude(dependency('org.bstats:.*:.*'))
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

// Capture at configuration time so the token-expansion closure doesn't touch
// Task.project at execution time (deprecated; breaks the configuration cache).
def pluginVersion = version
tasks.named('processResources') {
    filesMatching('plugin.yml') {
        expand version: pluginVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// End-to-end tests: plugwright boots a real Paper server with the shaded jar and
// drives it with mineflayer bots. Specs live in src/test/e2e; run with
// ./gradlew :packmerger-plugin:plugwrightTest (reports in build/reports/plugwright/).
// Ports are overridable so several checkouts (git worktrees) can run the suite at once:
//   ./gradlew :packmerger-plugin:plugwrightTest -Pe2ePort=25580 -Pe2eRconPort=25590 -Pe2eHttpPort=25581
def e2ePort = (findProperty('e2ePort') ?: '25567') as int
def e2eRconPort = (findProperty('e2eRconPort') ?: '25577') as int
def e2eHttpPort = (findProperty('e2eHttpPort') ?: '28567') as int
def e2eFixtures = file('src/test/e2e/fixtures')
plugwright {
    testsDir.set(file('src/test/e2e'))
    environments { envs ->
        envs.create('local', me.drownek.plugwright.local.LocalMode.INSTANCE) { spec ->
            spec.minecraftVersion.set('26.1.2')
            spec.acceptEula.set(true)
            spec.port.set(e2ePort)
            spec.rconPort.set(e2eRconPort)
            spec.jvmArgs.set(['-Xmx2G'])
            // Stage fixtures/** (PackMerger config.yml + fixture packs, bStats opt-out)
            // into plugins/ before every server start. The self-host port in the staged
            // config.yml follows e2eHttpPort, and the specs read it from e2e-ports.json.
            spec.writeFiles { files ->
                fileTree(e2eFixtures).visit { details ->
                    if (!details.directory) {
                        if (details.relativePath.pathString == 'PackMerger/config.yml') {
                            files.file("plugins/PackMerger/config.yml",
                                details.file.getText('UTF-8').replace('port: 28567', "port: ${e2eHttpPort}"))
                        } else {
                            files.file("plugins/${details.relativePath.pathString}", details.file)
                        }
                    }
                }
                files.file('plugins/PackMerger/e2e-ports.json',
                    groovy.json.JsonOutput.toJson([httpPort: e2eHttpPort, serverPort: e2ePort]))
            }
        }
    }
}
