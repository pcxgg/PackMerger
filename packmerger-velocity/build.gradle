plugins {
    id 'java'
    alias(libs.plugins.shadow)
}

// group + version come from the root build.gradle.
// The proxy jar takes the module name: packmerger-velocity-<version>.jar.

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly libs.velocity.api
    annotationProcessor libs.velocity.api   // generates velocity-plugin.json from @Plugin
    implementation project(':packmerger-common')   // shaded into the proxy jar
}

// @Plugin(version = ...) needs a compile-time constant: generate it from the project
// version so the proxy plugin never reports a stale hard-coded version again.
def generatedConstantsDir = layout.buildDirectory.dir('generated/sources/build-constants')
def generateBuildConstants = tasks.register('generateBuildConstants') {
    def projectVersion = project.version.toString()
    inputs.property('version', projectVersion)
    outputs.dir(generatedConstantsDir)
    doLast {
        def target = generatedConstantsDir.get().file('sh/pcx/packmerger/proxy/BuildConstants.java').asFile
        target.parentFile.mkdirs()
        target.text = """package sh.pcx.packmerger.proxy;

/** Generated at build time from the Gradle project version; do not edit. */
final class BuildConstants {
    private BuildConstants() {}

    static final String VERSION = "${projectVersion}";
}
"""
    }
}
sourceSets.main.java.srcDir(generateBuildConstants.map { generatedConstantsDir })

tasks.named('shadowJar') {
    archiveClassifier.set('')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Velocity 3.4 runs on Java 21; a Java 25 class file would not load there.
    options.release = 21
}
