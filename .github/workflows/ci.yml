name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bootstrap pcxgg forks
        uses: ./.github/actions/bootstrap-forks
        with:
          mockbukkit-ref: ''

      # `build` runs the full JUnit suite (via check) and produces the shaded
      # jar — the same artifact the release workflow ships. Until now nothing
      # ran the tests in CI; this is the gate.
      - name: Build and test
        run: ./gradlew build
