# Gradle version catalog — single source of truth for dependency versions.
# Referenced from build.gradle as `libs.*`. Bumps here are picked up by
# Dependabot (see .github/dependabot.yml).
[versions]
# Paper API. New (2026+) year-based scheme: <year>.<drop>.<patch>.build.<n>-<stage>.
# Compile against the OLDEST supported Paper API on purpose. Paper 26.3 ships Adventure 5;
# a jar compiled against it binds Adventure-5-only descriptors (e.g. TextComponent.Builder
# .build()) that throw NoSuchMethodError on 26.1/26.2 servers, while Adventure 5 keeps the
# Adventure-4 descriptors as bridges. So: compile on 26.1.2, test on 26.3 (plugwright e2e).
# `.build.+` resolves the latest published build of 26.1.2.
paper = "26.1.2.build.+"
commons-compress = "1.28.0"
# MinIO 9.x is a major API rewrite (io.minio.http.Method -> io.minio.Http.Method);
# S3UploadProvider was migrated for it. The runtime S3 upload path is not CI-verified.
minio = "9.0.3"
gson = "2.14.0"
junit = "6.1.0"
bstats = "3.2.1"
velocity = "3.4.0"
bungeecord = "1.21-R0.4"
shadow = "9.4.2"
plugwright = "3.0.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
minio = { module = "io.minio:minio", version.ref = "minio" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
plugwright = { id = "io.github.drownek.plugwright", version.ref = "plugwright" }
